<title>Concept Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#EEF0F3;
    --bg-panel:#FFFFFF;
    --bg-sunken:#E2E6EA;
    --ink:#20242B;
    --ink-soft:#5A616B;
    --line:#D2D7DC;
    --amber:#B15A15;
    --amber-bg:#F3E1CE;
    --teal:#186F67;
    --teal-bg:#D6EAE7;
    --violet:#5B4BB0;
    --violet-bg:#E0DCF3;
    --plum:#8E3B6B;
    --plum-bg:#F0DAE7;
    --focus:#2A6FD6;
    --font-display:'Big Shoulders Display', system-ui, sans-serif;
    --font-body:'Source Sans 3', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171C; --bg-panel:#1C2027; --bg-sunken:#11141A;
      --ink:#E7E9ED; --ink-soft:#9AA1AC; --line:#2E343D;
      --amber:#E2924D; --amber-bg:#3B2A18; --teal:#57BCB2; --teal-bg:#173330;
      --violet:#A79BF0; --violet-bg:#241F3D; --plum:#E08AB8; --plum-bg:#3A1E2E;
      --focus:#6FA3F2;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171C; --bg-panel:#1C2027; --bg-sunken:#11141A;
    --ink:#E7E9ED; --ink-soft:#9AA1AC; --line:#2E343D;
    --amber:#E2924D; --amber-bg:#3B2A18; --teal:#57BCB2; --teal-bg:#173330;
    --violet:#A79BF0; --violet-bg:#241F3D; --plum:#E08AB8; --plum-bg:#3A1E2E;
    --focus:#6FA3F2;
  }

  *{ box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:800; margin:0; text-wrap:balance; }
  p{ margin:0 0 0.85em; }
  ::selection{ background:var(--amber-bg); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
  button{ font-family:var(--font-mono); cursor:pointer; }

  .eyebrow{ font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.13em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }

  /* ---- topbar ---- */
  .topbar{
    display:flex; flex-wrap:wrap; gap:1rem 1.5rem; align-items:center; justify-content:space-between;
    padding:1rem clamp(1rem,3vw,2rem); border-bottom:1px solid var(--line); background:var(--bg-panel);
  }
  .topbar h1{ font-size:clamp(1.5rem,3vw,1.9rem); line-height:1; }
  .topbar .brand{ display:flex; flex-direction:column; gap:0.15rem; }
  .controls{ display:flex; gap:0.7rem; align-items:center; flex-wrap:wrap; }
  #search{
    background:var(--bg-sunken); border:1px solid var(--line); border-radius:7px; color:var(--ink);
    font-family:var(--font-body); font-size:0.9rem; padding:0.5rem 0.8rem; min-width:200px;
  }
  #search:focus{ outline:2px solid var(--focus); outline-offset:1px; }
  .view-toggle{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .view-toggle button{
    background:var(--bg-panel); color:var(--ink-soft); border:none; padding:0.5rem 0.9rem; font-size:0.78rem;
    letter-spacing:0.03em; text-transform:uppercase; font-weight:600;
  }
  .view-toggle button.active{ background:var(--ink); color:var(--bg-panel); }

  /* ---- legend bar ---- */
  .legend-bar{
    display:flex; flex-wrap:wrap; gap:1.1rem 1.6rem; align-items:center;
    padding:0.7rem clamp(1rem,3vw,2rem); border-bottom:1px solid var(--line);
    font-family:var(--font-mono); font-size:0.78rem; color:var(--ink-soft); background:var(--bg);
  }
  .legend-item{ display:flex; align-items:center; gap:0.45rem; }
  .swatch{ width:11px; height:11px; border-radius:50%; flex:none; }
  .swatch.amber{ background:var(--amber); } .swatch.teal{ background:var(--teal); } .swatch.core{ background:var(--ink-soft); }
  .swatch.violet{ background:var(--violet); } .swatch.plum{ background:var(--plum); }
  .deep-dot{ width:11px; height:11px; border-radius:50%; border:2px solid var(--ink); flex:none; }

  /* ---- stage ---- */
  .stage{ position:relative; flex:1; min-height:0; }
  .graph-wrap, .list-wrap{ position:absolute; inset:0; overflow:auto; }
  #graphCanvas{ display:block; width:100%; height:100%; touch-action:none; }
  .empty-msg{ position:absolute; top:1rem; left:50%; transform:translateX(-50%); font-family:var(--font-mono); font-size:0.85rem; color:var(--ink-soft); background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:0.5rem 1rem; }

  .list-wrap{ padding:1.4rem clamp(1rem,3vw,2rem) 3rem; }
  .list-group{ margin-bottom:2rem; }
  .list-group h2{ font-size:1.2rem; margin-bottom:0.8rem; display:flex; align-items:center; gap:0.5rem; }
  .cards{ display:grid; gap:0.75rem; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); }
  .card{
    text-align:left; background:var(--bg-panel); border:1px solid var(--line); border-left-width:4px;
    border-radius:9px; padding:0.9rem 1rem; cursor:pointer; font-family:var(--font-body); color:var(--ink);
  }
  .card:hover{ border-color:var(--ink-soft); }
  .card h3{ font-size:1rem; margin-bottom:0.3rem; font-family:var(--font-body); font-weight:700; }
  .card p{ font-size:0.85rem; color:var(--ink-soft); margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .tag{ font-family:var(--font-mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-top:0.4rem; display:inline-block; }

  /* ---- detail panel ---- */
  .panel{
    position:fixed; top:0; right:0; height:100%; width:400px; max-width:90vw;
    background:var(--bg-panel); border-left:1px solid var(--line); box-shadow:-12px 0 32px rgba(0,0,0,0.12);
    transform:translateX(100%); transition:transform 0.25s ease; z-index:50; overflow-y:auto;
    padding:1.6rem 1.5rem 2.5rem;
  }
  .panel.open{ transform:translateX(0); }
  .panel-close{
    position:absolute; top:1rem; right:1rem; background:none; border:none; color:var(--ink-soft);
    font-size:1.1rem; line-height:1; padding:0.3rem; border-radius:6px;
  }
  .panel-close:hover{ color:var(--ink); background:var(--bg-sunken); }
  .panel-cat{ display:inline-block; font-family:var(--font-mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; padding:0.25rem 0.6rem; border-radius:99px; margin-bottom:0.8rem; }
  .panel h2{ font-size:1.7rem; margin-bottom:0.9rem; padding-right:1.5rem; }
  .panel .note{ font-size:0.98rem; color:var(--ink); max-width:none; }
  .panel .related-label{ font-family:var(--font-mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin:1.3rem 0 0.6rem; }
  .related-chips{ display:flex; flex-wrap:wrap; gap:0.4rem; }
  .related-chips button{
    background:var(--bg-sunken); border:1px solid var(--line); border-radius:99px; color:var(--ink);
    font-family:var(--font-body); font-size:0.82rem; padding:0.3rem 0.75rem;
  }
  .related-chips button:hover{ border-color:var(--ink-soft); }
  .deepdive-link{
    display:inline-flex; align-items:center; gap:0.4rem; margin-top:1.4rem; text-decoration:none;
    background:var(--ink); color:var(--bg-panel); font-family:var(--font-mono); font-size:0.82rem;
    padding:0.6rem 1rem; border-radius:8px; font-weight:600;
  }
  .deepdive-link:hover{ filter:brightness(1.15); }
  .no-deepdive{ margin-top:1.4rem; font-family:var(--font-mono); font-size:0.8rem; color:var(--ink-soft); border:1px dashed var(--line); border-radius:8px; padding:0.7rem 0.9rem; }

  @media (max-width:720px){
    .panel{ top:auto; bottom:0; left:0; right:0; width:100%; max-width:100%; height:auto; max-height:75vh;
      border-left:none; border-top:1px solid var(--line); border-radius:16px 16px 0 0; transform:translateY(100%); }
    .panel.open{ transform:translateY(0); }
  }

  footer{ padding:0.9rem clamp(1rem,3vw,2rem); border-top:1px solid var(--line); background:var(--bg-panel); color:var(--ink-soft); font-family:var(--font-mono); font-size:0.76rem; }
</style>

<div class="topbar">
  <div class="brand">
    <span class="eyebrow">A living map</span>
    <h1>Concept Atlas</h1>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="Find a concept…" aria-label="Search concepts">
    <div class="view-toggle" role="group" aria-label="View mode">
      <button id="viewGraphBtn" class="active" type="button" aria-pressed="true">Graph</button>
      <button id="viewListBtn" type="button" aria-pressed="false">List</button>
    </div>
  </div>
</div>

<div class="legend-bar">
  <span class="legend-item"><span class="swatch amber"></span>Generative AI</span>
  <span class="legend-item"><span class="swatch teal"></span>Retrieval / RAG</span>
  <span class="legend-item"><span class="swatch violet"></span>Agents &amp; Tool Use</span>
  <span class="legend-item"><span class="swatch plum"></span>Reliability &amp; Evaluation</span>
  <span class="legend-item"><span class="swatch core"></span>Cross-cutting</span>
  <span class="legend-item"><span class="deep-dot"></span>Has a full interactive deep dive</span>
</div>

<div class="stage">
  <div class="graph-wrap" id="graphWrap">
    <canvas id="graphCanvas"></canvas>
    <div class="empty-msg" id="emptyMsg" hidden>No concepts match "<span id="emptyQuery"></span>".</div>
  </div>
  <div class="list-wrap" id="listWrap" hidden></div>
</div>

<aside class="panel" id="detailPanel" tabindex="-1" aria-hidden="true">
  <button class="panel-close" id="panelClose" type="button" aria-label="Close detail panel">✕</button>
  <div id="panelBody"></div>
</aside>

<footer id="footerNote"></footer>

<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var BYTE_TO_ANSWER = 'byte-to-answer.html';

  var CATS = {
    genai: { colorVar:'--amber', label:'Generative AI' },
    rag:   { colorVar:'--teal',  label:'Retrieval / RAG' },
    agent: { colorVar:'--violet', label:'Agents & Tool Use' },
    trust: { colorVar:'--plum',  label:'Reliability & Evaluation' },
    core:  { colorVar:'--ink-soft', label:'Cross-cutting' }
  };

  var CONCEPTS = [
    { id:'byte', label:'Byte', cat:'genai',
      note:'The most basic unit a computer stores text as — 8 bits. Before a model can see "words", your text is already just a stream of bytes; UTF-8 is the encoding almost everything on the web uses.',
      deepDive: BYTE_TO_ANSWER+'#s-bytes' },
    { id:'token', label:'Token', cat:'genai',
      note:'A chunk of text — anywhere from one character to a whole word — that a model treats as a single unit. Real vocabularies hold tens of thousands of tokens, each mapped to an integer ID.',
      deepDive: BYTE_TO_ANSWER+'#s-tokens' },
    { id:'bpe', label:'Byte-Pair Encoding', cat:'genai',
      note:'The algorithm most tokenizers use to decide what counts as a token: start from individual bytes, then repeatedly merge whichever adjacent pair shows up most often in a huge training corpus, until you hit a target vocabulary size.',
      deepDive: BYTE_TO_ANSWER+'#s-tokens' },
    { id:'embedding', label:'Embedding', cat:'genai',
      note:'A list of numbers that stands in for a token\'s meaning. Learned during training so that tokens used in similar contexts end up with similar vectors — the whole basis for a model doing math on language at all.',
      deepDive: BYTE_TO_ANSWER+'#s-embed' },
    { id:'posenc', label:'Positional Encoding', cat:'genai',
      note:'A vector added to each token\'s embedding, generated purely from its position in the sequence. Without it, self-attention can\'t tell "dog bites man" from "man bites dog" — it has no built-in sense of order.',
      deepDive: BYTE_TO_ANSWER+'#s-posenc' },
    { id:'attention', label:'Self-Attention', cat:'genai',
      note:'The mechanism that lets every token look at every other token and decide how much to borrow from each, weighted by relevance — computed from Query, Key and Value vectors.',
      deepDive: BYTE_TO_ANSWER+'#s-attention' },
    { id:'multihead', label:'Multi-Head Attention', cat:'genai',
      note:'Running several attention "heads" in parallel, each with its own Query/Key/Value projections, so different heads can specialize — one might track nearby words, another long-range references.',
      deepDive: BYTE_TO_ANSWER+'#s-attention' },
    { id:'residual', label:'Residual Connection', cat:'genai',
      note:'A shortcut that adds a layer\'s input back onto its output. It guarantees information — and, during training, gradient — always has an unobstructed path through, which is what makes very deep stacks of layers trainable at all.',
      deepDive: BYTE_TO_ANSWER+'#s-ffn' },
    { id:'layernorm', label:'Layer Normalization', cat:'genai',
      note:'Rescales a vector to a stable mean and variance before it moves to the next layer, keeping numbers from exploding or vanishing as they pass through dozens of stacked blocks.',
      deepDive: BYTE_TO_ANSWER+'#s-ffn' },
    { id:'feedforward', label:'Feed-Forward Network', cat:'genai',
      note:'A small two-layer network applied independently to every token: expand to a wider hidden size, apply a non-linearity, then contract back down. A large share of a model\'s factual and pattern-matching capacity is thought to live here.',
      deepDive: BYTE_TO_ANSWER+'#s-ffn' },
    { id:'transformer', label:'Transformer Block', cat:'genai',
      note:'The repeating unit of a modern language model: multi-head attention, then a feed-forward network, each wrapped in a residual connection and layer norm. Stack it dozens of times and you have GPT, Claude, or any of their peers.',
      deepDive: BYTE_TO_ANSWER+'#s-stack' },
    { id:'softmax', label:'Softmax', cat:'genai',
      note:'Turns a list of raw scores into probabilities that sum to 1, exaggerating the gap between the largest and smallest. Used everywhere a model turns "scores" into a distribution — attention weights, next-token probabilities.',
      deepDive: BYTE_TO_ANSWER+'#s-sampling' },
    { id:'sampling', label:'Sampling & Decoding', cat:'genai',
      note:'The step where a probability distribution over the whole vocabulary becomes one chosen token. Greedy decoding always takes the top probability; sampling introduces controlled randomness instead.',
      deepDive: BYTE_TO_ANSWER+'#s-sampling' },
    { id:'temperature', label:'Temperature', cat:'genai',
      note:'A single number that reshapes a probability distribution before sampling. Near zero makes the model deterministic and repetitive; above one makes it more random and occasionally incoherent.',
      deepDive: BYTE_TO_ANSWER+'#s-sampling' },
    { id:'chunking', label:'Chunking', cat:'rag',
      note:'Splitting a long document into smaller, overlapping pieces small enough to embed meaningfully and retrieve precisely — the first step in building anything RAG can search.',
      deepDive: BYTE_TO_ANSWER+'#s-chunking' },
    { id:'vectorindex', label:'Vector Index', cat:'rag',
      note:'A data structure — FAISS, HNSW, or a managed vector database — built to find the nearest vectors to a query vector quickly, even across millions of embeddings.',
      deepDive: BYTE_TO_ANSWER+'#s-index' },
    { id:'cosine', label:'Cosine Similarity', cat:'rag',
      note:'A measure of how similarly two vectors point, from -1 to 1, ignoring their length. The default yardstick for "how relevant is this chunk to this question" in a vector search.',
      deepDive: BYTE_TO_ANSWER+'#s-retrieval' },
    { id:'retrieval', label:'Retrieval', cat:'rag',
      note:'Finding the passages most relevant to a question by embedding the question and ranking every candidate chunk against it — usually by cosine similarity.',
      deepDive: BYTE_TO_ANSWER+'#s-retrieval' },
    { id:'contextwindow', label:'Context Window', cat:'rag',
      note:'The full text a model actually reads before generating: instructions, retrieved passages, conversation history, and the live question, all within a fixed token budget.',
      deepDive: BYTE_TO_ANSWER+'#s-prompt' },
    { id:'promptassembly', label:'Prompt Assembly', cat:'rag',
      note:'The step where retrieved passages, a system instruction, and the user\'s question get stitched into one block of text — the model itself never changes, only what it\'s handed to read.',
      deepDive: BYTE_TO_ANSWER+'#s-prompt' },
    { id:'hallucination', label:'Hallucination', cat:'core',
      note:'A fluent, confident answer that is factually wrong or unsupported — because the model is still just predicting plausible next tokens, not checking anything against a source. RAG doesn\'t eliminate this, but it gives the model something true to draw on instead of guessing.',
      deepDive: BYTE_TO_ANSWER+'#s-hallucination' },

    /* ---- Retrieval beyond the basic RAG loop ---- */
    { id:'hybridretrieval', label:'Hybrid Retrieval', cat:'rag',
      note:'Running two different searches over the same corpus — dense vector similarity and literal keyword matching — then fusing their rankings. Each fails differently: vectors catch a paraphrase but blur exact tokens like a version number or a type name, while keyword search nails the literal string and is blind to rewording. Fusing keeps both strengths.' ,
      deepDive: BYTE_TO_ANSWER+'#s-hybrid' },
    { id:'lexicalsearch', label:'Lexical Search (BM25)', cat:'rag',
      note:'Ranking by literal term overlap rather than learned meaning, using an inverted index and a scoring function like BM25 that rewards rare terms and discounts long documents. Fast, exact and explainable — and completely unable to match a synonym.' ,
      deepDive: BYTE_TO_ANSWER+'#s-hybrid' },
    { id:'rrf', label:'Reciprocal Rank Fusion', cat:'rag',
      note:'A way to merge two ranked lists without their scores having to be on the same scale: each item scores 1/(k + rank) in every list it appears in, and those are summed. An item ranked well by both methods rises above one that only a single method liked.' ,
      deepDive: BYTE_TO_ANSWER+'#s-hybrid' },
    { id:'reranking', label:'Re-ranking', cat:'rag',
      note:'A second, more expensive pass over the handful of candidates the first retrieval returned, scoring each against the query with a cross-encoder or a model that reads query and passage together. Retrieval buys recall cheaply; re-ranking buys precision on the short list that survived.' ,
      deepDive: BYTE_TO_ANSWER+'#s-hybrid' },
    { id:'metadatafilter', label:'Metadata Filtering', cat:'rag',
      note:'Constraining retrieval with a hard predicate — scope, tenant, date, document type — applied as a query condition rather than a hint in the prompt. Filtering before scoring means an ineligible chunk can never occupy a slot a valid one should have had.' },
    { id:'indexprovenance', label:'Index Provenance', cat:'rag',
      note:'The record of which embedding model built an index. Vectors from two different models are not comparable, so querying an index with a different model than built it returns numbers that look like answers but mean nothing — recording provenance lets the system refuse rather than silently degrade.' },
    { id:'querytransform', label:'Query Transformation', cat:'rag',
      note:'Rewriting the question before retrieval: expanding abbreviations, splitting a compound question, or generating several paraphrases and merging their results. The question a person asks is often not the question that best matches how the corpus happens to be written.' },

    /* ---- Function / tool calling ---- */
    { id:'functioncalling', label:'Function Calling', cat:'agent',
      note:'The mechanism that lets a model trigger real code. The model never executes anything itself: it emits a structured request naming a function and its arguments, the host runtime validates and runs the real function, then feeds the return value back as another message. Everything "agentic" is built on this one primitive.' ,
      deepDive: BYTE_TO_ANSWER+'#s-tools' },
    { id:'tool', label:'Tool', cat:'agent',
      note:'One callable unit of work exposed to a model: a name, a description, a typed parameter list, a return value. The description is not documentation — it is the only thing the model uses to decide when the tool applies, so a vague description produces wrong tool choices no amount of prompting fixes.' ,
      deepDive: BYTE_TO_ANSWER+'#s-tools' },
    { id:'toolschema', label:'Tool Schema', cat:'agent',
      note:'The machine-readable contract — usually JSON Schema — describing a tool\'s parameters, sent to the model alongside the conversation. Mature frameworks generate it automatically from a function signature and its annotations, which is what stops the runnable code and the model\'s view of it drifting apart.' ,
      deepDive: BYTE_TO_ANSWER+'#s-tools' },
    { id:'plugin', label:'Plugin (Tool Group)', cat:'agent',
      note:'A named collection of tools registered together. The name acts as a namespace so identically-named tools from different sources cannot collide, and it gives surrounding code a cheap way to reason about a whole class of tools at once instead of matching individual function names.' },
    { id:'toolchoice', label:'Tool Choice Policy', cat:'agent',
      note:'The setting governing whether a model may call tools on a turn: automatic (decide for itself), required (must call one), a specific named tool, or none (answer in text only). Forcing a call is how you guarantee structure; forbidding one is how you guarantee a plain answer.' ,
      deepDive: BYTE_TO_ANSWER+'#s-loop' },
    { id:'toolloop', label:'Tool-Calling Loop', cat:'agent',
      note:'The cycle underneath every agent: send the conversation, the model requests a tool, run it, append the result, send again — repeating until the model replies without asking for another tool. The loop, not the model, is what turns a single completion into multi-step work.' ,
      deepDive: BYTE_TO_ANSWER+'#s-loop' },
    { id:'toolresult', label:'Tool Result', cat:'agent',
      note:'The value a tool returns, appended to the conversation as a message the model reads on its next pass. It is ordinary data, never a command — and it is frequently serialized to a string before anything downstream sees it, which matters whenever surrounding code expects the original typed object back.' ,
      deepDive: BYTE_TO_ANSWER+'#s-loop' },
    { id:'paralleltools', label:'Parallel Tool Calls', cat:'agent',
      note:'A single model turn requesting several independent tools at once, executed concurrently rather than one after another. Correct only when the calls genuinely do not depend on each other\'s results — otherwise the model is guessing at an ordering it should have made explicit.' },
    { id:'structuredoutput', label:'Structured Output', cat:'agent',
      note:'Constraining a model to return data matching a schema instead of prose, so the result deserializes straight into a typed object. Turns "parse the model\'s English", which is endlessly brittle, into an ordinary deserialization step that either succeeds or fails loudly.' ,
      deepDive: BYTE_TO_ANSWER+'#s-structured' },
    { id:'schemarepair', label:'Output Repair Retry', cat:'agent',
      note:'A bounded second attempt when a structured response fails to parse, handing the model back its own malformed output and the error. One retry recovers most formatting slips; unbounded retrying just multiplies cost against a model that has already shown it cannot satisfy the schema.' ,
      deepDive: BYTE_TO_ANSWER+'#s-structured' },
    { id:'invocationfilter', label:'Invocation Filter', cat:'agent',
      note:'Middleware wrapping every tool call: it can inspect arguments before execution, inspect the result after, block the call, or signal the surrounding loop to stop. The natural home for auditing, permission checks and control-flow signals, because it sees every call without each tool having to cooperate.' ,
      deepDive: BYTE_TO_ANSWER+'#s-handoff' },
    { id:'earlytermination', label:'Early Termination', cat:'agent',
      note:'Deliberately halting a model\'s tool-calling loop the moment a particular tool runs, rather than letting it keep reasoning. Turns a tool call into a control signal: the call itself, not the text around it, is what ends the turn — which is far more reliable than detecting intent in prose.' ,
      deepDive: BYTE_TO_ANSWER+'#s-handoff' },

    /* ---- Agents ---- */
    { id:'agent', label:'Agent', cat:'agent',
      note:'A model paired with standing instructions, a set of tools, and a loop that lets it act repeatedly until its task is done. The word describes the assembly, not the model — the same model becomes an entirely different agent by changing its instructions and its toolbox.' },
    { id:'systemmessage', label:'System Instructions', cat:'agent',
      note:'The standing brief defining an agent\'s role, scope, method and stopping condition, prepended to every call it makes. It is the agent\'s job description, and most unreliable agent behaviour traces back to instructions that were vague about when to stop or which tool to prefer.' },
    { id:'leastprivilege', label:'Least-Privilege Tooling', cat:'agent',
      note:'Giving each agent only the tools its own job requires, so actions outside that job are impossible rather than merely discouraged. A capability the model was never handed cannot be misused by a clever prompt; an instruction saying "never do X" can be.' ,
      deepDive: BYTE_TO_ANSWER+'#s-approval' },
    { id:'conversationhistory', label:'Conversation History', cat:'agent',
      note:'The accumulated messages an agent is re-sent on every call: instructions, user turns, its own replies, and tool calls with their results. Models are stateless between calls, so this list is the entire memory of a session, and its shape decides what the agent can still "remember".' },
    { id:'contextmanagement', label:'Context Management', cat:'agent',
      note:'Deciding what stays in a growing history and what gets dropped, summarized or offloaded as it nears the context limit. Every long-running agent eventually needs a policy here, because unbounded history is first expensive and then impossible.' },
    { id:'sharedcontext', label:'Shared vs Isolated Context', cat:'agent',
      note:'Whether collaborating agents read one common transcript or each keep their own. Sharing lets a later agent build on earlier work without re-deriving it; isolating stops agents anchoring on each other, which is what makes their agreement evidence rather than echo.' },
    { id:'agentstate', label:'Agent Session State', cat:'agent',
      note:'The live conversation an agent holds between interactions, kept somewhere outside any single request so a paused workflow can resume exactly where it stopped. Without it, every resumption restarts the task from nothing.' },

    /* ---- Multi-agent orchestration ---- */
    { id:'multiagent', label:'Multi-Agent System', cat:'agent',
      note:'Several narrowly-scoped agents collaborating on one task instead of a single agent holding the whole job. The gain is not extra intelligence but smaller decisions: each agent faces a shorter instruction and fewer tools, and reliability of tool choice degrades as both grow.' ,
      deepDive: BYTE_TO_ANSWER+'#s-orchestration' },
    { id:'rolespecialization', label:'Role Specialization', cat:'agent',
      note:'Splitting work by concern so each agent has one job and one perspective. Beyond reliability it makes output auditable: a labelled sequence of narrow steps can be reviewed by a person, while one long stretch of internal reasoning cannot.' },
    { id:'orchestration', label:'Orchestration', cat:'agent',
      note:'The layer deciding which agent runs, when, and with what input. Deliberately ordinary code in most mature designs — sequencing is a decision that can be written down once, so spending model calls and inheriting non-determinism on it buys nothing.' ,
      deepDive: BYTE_TO_ANSWER+'#s-orchestration' },
    { id:'sequentialorch', label:'Sequential Orchestration', cat:'agent',
      note:'A fixed pipeline: each agent\'s output becomes the next one\'s input, in a predetermined order with no branching. The right shape when the work genuinely has stages, each depending on the one before it.' ,
      deepDive: BYTE_TO_ANSWER+'#s-orchestration' },
    { id:'concurrentorch', label:'Concurrent Orchestration', cat:'agent',
      note:'Fanning the same input out to several agents in parallel and collecting all their outputs. Suits independent perspectives on one artifact; wasteful the moment one agent\'s work is an input to another\'s.' ,
      deepDive: BYTE_TO_ANSWER+'#s-orchestration' },
    { id:'groupchat', label:'Group Chat Orchestration', cat:'agent',
      note:'A shared conversation where a manager decides who speaks next after each turn, whether to ask a human, and when to stop. The flexible option — appropriate when the order of contributions genuinely cannot be predicted in advance.' ,
      deepDive: BYTE_TO_ANSWER+'#s-orchestration' },
    { id:'handoff', label:'Handoff Orchestration', cat:'agent',
      note:'Agents explicitly transferring control to one another, each deciding who takes over next. Fits work shaped like a flowchart — mostly linear, a few known branch points, and a clear notion of "my part is finished" — rather than a free-form discussion.' ,
      deepDive: BYTE_TO_ANSWER+'#s-orchestration' },
    { id:'handofffunction', label:'Handoff Function', cat:'agent',
      note:'A tool that does no real work and exists only to be called as a signal that control should move — to another agent, to a human, or to completion. Watching for an unambiguous function call is vastly more reliable than parsing free text for an intent to finish.' ,
      deepDive: BYTE_TO_ANSWER+'#s-handoff' },
    { id:'selector', label:'Speaker Selection', cat:'agent',
      note:'The policy picking the next agent to act: round-robin, a rules table, or a model asked to choose. A model-driven selector buys flexibility at the price of one extra call and one more source of non-determinism per turn.' },
    { id:'terminationcondition', label:'Termination Condition', cat:'agent',
      note:'The rule that ends a multi-agent run: a completion signal, a keyword in the output, a handoff to a human, or a cap being reached. Every loop containing a model needs at least one condition that cannot itself fail, or a confused agent runs indefinitely.' },
    { id:'turnbudget', label:'Turn Budget', cat:'agent',
      note:'A hard ceiling on how many agent turns or model calls one task may consume, enforced by the orchestrator rather than requested in a prompt. Bounds worst-case cost and latency, and converts a silent infinite loop into a visible, reportable failure.' ,
      deepDive: BYTE_TO_ANSWER+'#s-loop' },
    { id:'stallrecovery', label:'Stall Recovery', cat:'agent',
      note:'Handling the case where an agent produces no usable progress — plain text where a tool call was required, or an empty response. A bounded retry with an explicit nudge recovers most instances; without one, an ordinary model hiccup becomes a dead workflow.' ,
      deepDive: BYTE_TO_ANSWER+'#s-handoff' },
    { id:'agentastool', label:'Agent as a Tool', cat:'agent',
      note:'Exposing an entire agent to another agent as if it were a single callable function. Turns delegation into an ordinary tool call and lets hierarchies compose, at the cost of hiding the sub-agent\'s reasoning from the caller\'s transcript.' },
    { id:'judge', label:'Judge / Adjudicator', cat:'agent',
      note:'A dedicated agent reviewing other agents\' output: merging duplicates, resolving conflicts, setting final rankings or severities. Effective only when handed questions that genuinely need judgement — anything mechanically checkable should be settled in code before it ever arrives.' },
    { id:'challengeround', label:'Challenge Round', cat:'agent',
      note:'A bounded pass where agents examine each other\'s conclusions and corroborate, contest with evidence, or abstain. Deliberately breaks isolation once, after independent work is finished, so agreement carries information that a group discussion from the start would have destroyed.' },
    { id:'corroboration', label:'Corroboration & Contest', cat:'agent',
      note:'The two useful outcomes of cross-examination: independent agreement, which raises confidence, and disagreement backed by evidence, which lowers it or removes the claim. Both are only meaningful if abstaining is an equally acceptable answer — otherwise everything drifts toward polite agreement.' },

    /* ---- Human in the loop ---- */
    { id:'hitl', label:'Human-in-the-Loop', cat:'agent',
      note:'Designing a workflow so a person makes specific decisions inside it, rather than only reviewing the end. Applied where a mistake is expensive or irreversible, and where a human can decide quickly from material the system has already assembled for them.' ,
      deepDive: BYTE_TO_ANSWER+'#s-approval' },
    { id:'approvalgate', label:'Approval Gate', cat:'agent',
      note:'A required human confirmation placed immediately before an irreversible action. The system prepares everything and then stops; the action is not attempted until an explicit approval arrives, which makes "who authorised this" answerable after the fact.' ,
      deepDive: BYTE_TO_ANSWER+'#s-approval' },
    { id:'pauseresume', label:'Pause & Resume', cat:'agent',
      note:'Structuring a long workflow so it can suspend at a decision point, hand control back to the caller, and continue later from the same state. Fits request-response interfaces naturally, where each resumption is simply the next request carrying the answer.' ,
      deepDive: BYTE_TO_ANSWER+'#s-approval' },
    { id:'blockingcallback', label:'Blocking Callback', cat:'agent',
      note:'The alternative to pause-and-resume: the workflow calls out for human input and waits inside the still-running call. Simple in a console program, awkward on the web, where it forces one long-lived operation to stay alive across separate requests.' },

    /* ---- Reliability, grounding, guardrails ---- */
    { id:'verification', label:'Verification Layer', cat:'trust',
      note:'A deterministic check, after generation, that every claim the model made can be substantiated against a real source — and the deletion of whatever cannot. Distinct from grounding: grounding improves the odds the model is right, verification establishes whether this specific output actually is.' ,
      deepDive: BYTE_TO_ANSWER+'#s-verify' },
    { id:'citation', label:'Citation Binding', cat:'trust',
      note:'Requiring every claim to name the exact source passage supporting it, precisely enough that code can look it up and confirm the quoted text really appears there. A citation that cannot be mechanically resolved is decoration, not evidence.' ,
      deepDive: BYTE_TO_ANSWER+'#s-verify' },
    { id:'sourceanchor', label:'Source Anchor', cat:'trust',
      note:'A pointer into the material under discussion — a file and line range, a page, a timestamp — checked to exist before the claim referencing it is allowed to stand. Catches the confident, specific claim about a line that was never in the input at all.' ,
      deepDive: BYTE_TO_ANSWER+'#s-verify' },
    { id:'suppression', label:'Suppression', cat:'trust',
      note:'Discarding an unverifiable output while publishing the fact that it was discarded, with the original text and the specific check it failed. Silent dropping hides how often a model overreaches; a visible suppression record turns reliability into something measurable.' ,
      deepDive: BYTE_TO_ANSWER+'#s-verify' },
    { id:'schemaguard', label:'Schema as Guardrail', cat:'trust',
      note:'Making required evidence part of the output type, so a response missing it cannot be deserialized at all. Moves a rule out of an instruction the model may ignore and into a constraint the type system enforces before any code sees the value.' ,
      deepDive: BYTE_TO_ANSWER+'#s-structured' },
    { id:'guardrail', label:'Guardrail', cat:'trust',
      note:'Any constraint outside the model limiting what its output can cause: input validation, output schemas, permission checks, blocked actions, spending caps. Layered, because each catches a different failure — and none of them is the prompt.' },
    { id:'determinismboundary', label:'Determinism Boundary', cat:'trust',
      note:'The deliberate line where model judgement stops and fixed rules take over, drawn just before consequential decisions. Identical inputs then always produce identical outcomes, and the reasoning behind the final call can be checked by hand.' },
    { id:'rulegate', label:'Deterministic Rule Gate', cat:'trust',
      note:'A hard-coded decision table applied to a model\'s output — thresholds, counts, allow-lists — producing the final call. Cheap, auditable, and the natural place for policy that must not vary between two runs on the same input.' },
    { id:'promptinjection', label:'Prompt Injection', cat:'trust',
      note:'Untrusted content — a fetched page, a document, a tool result — containing text engineered to read as instructions to the model. Uniquely dangerous in agent systems, because a successful injection inherits whatever tools the agent is holding.' ,
      deepDive: BYTE_TO_ANSWER+'#s-verify' },
    { id:'datainstruction', label:'Data / Instruction Boundary', cat:'trust',
      note:'Explicitly marking retrieved or fetched content as material to analyse, never as directions to follow. A mitigation rather than a cure: the real defence is least-privilege tooling, so that a successful injection still cannot reach anything harmful.' ,
      deepDive: BYTE_TO_ANSWER+'#s-verify' },
    { id:'gracefuldegradation', label:'Graceful Degradation', cat:'trust',
      note:'Letting one failed component cost only its own contribution instead of the whole run — and saying so in the output. A partial result that declares itself partial is useful; one that silently looks complete is dangerous.' },
    { id:'observability', label:'Agent Observability', cat:'trust',
      note:'Recording per-step calls, tokens, latency, tool invocations and outcomes for every agent in a run. Multi-agent failures are usually invisible in the final answer, so a trace of who did what is the only practical way to debug or cost them.' },
    { id:'streamingprogress', label:'Progress Streaming', cat:'trust',
      note:'Pushing events to the caller as a long-running workflow advances, instead of only at the end. Multi-agent runs take far longer than a single completion, and a visible trace is the difference between a system that looks like it is working and one that looks hung.' },
    { id:'backgroundwork', label:'Background Execution', cat:'trust',
      note:'Running a long agent workflow outside the request that triggered it — accepted onto a queue, worked by a background process, results collected separately. Keeps a multi-minute pipeline from being tied to the lifetime of a single connection.' },
    { id:'caching', label:'Response Caching', cat:'trust',
      note:'Reusing a stored response for an identical request rather than paying for it twice. Especially valuable during development and demos, where the same prompt gets run repeatedly against a finite quota.' },
    { id:'concurrencylimit', label:'Concurrency Throttling', cat:'trust',
      note:'Capping how many model calls run at once so fan-out respects provider rate limits instead of triggering them. The binding limit is almost always the provider\'s quota, not the machine\'s capacity to run tasks.' },
    { id:'tokenbudget', label:'Token Budget', cat:'trust',
      note:'The finite context and output allowance a call must fit inside, and the running cost of everything sent. Multi-agent designs multiply it quickly, since every agent re-reads shared context and every stage pays for its own prompt again.' },
    { id:'reasoningtokens', label:'Reasoning Tokens', cat:'trust',
      note:'Hidden tokens some models generate to think before producing visible output. They consume the same budget, so a ceiling set with a normal model in mind can leave a reasoning model no room to answer — producing an empty response rather than an error.' },
    { id:'modelvariance', label:'Provider & Model Variance', cat:'trust',
      note:'Behavioural differences between models and API versions: rejected parameters, differing tool-calling reliability, empty completions under particular conditions. Code that worked against one deployment can fail against another with the same nominal interface, so the exact model is part of the configuration, not an implementation detail.' },

    /* ---- Evaluation ---- */
    { id:'evalharness', label:'Evaluation Harness', cat:'trust',
      note:'A repeatable script running the system against fixed inputs and scoring the output automatically. Without one, "did that change help?" can only be answered by impression — which is exactly the question that matters most when tuning prompts and pipelines.' ,
      deepDive: BYTE_TO_ANSWER+'#s-eval' },
    { id:'goldenset', label:'Golden Set', cat:'trust',
      note:'A fixed collection of inputs with known-correct expected outputs, curated by hand. The reference every change is measured against, and its quality caps the usefulness of every number derived from it.' ,
      deepDive: BYTE_TO_ANSWER+'#s-eval' },
    { id:'precisionrecall', label:'Precision & Recall', cat:'trust',
      note:'The two ways an output can be wrong, measured separately: precision is what fraction of what it reported was real, recall what fraction of the real issues it found. Nearly every design choice trades one against the other, so a single accuracy number hides the trade being made.' ,
      deepDive: BYTE_TO_ANSWER+'#s-eval' },
    { id:'baselinecompare', label:'Baseline Comparison', cat:'trust',
      note:'Scoring an elaborate design against the simplest thing that could work, on identical inputs. The only way to know whether the complexity is earning anything — and complex agent systems frequently fail to beat one well-prompted call.' ,
      deepDive: BYTE_TO_ANSWER+'#s-eval' },
    { id:'fixtures', label:'Recorded Fixtures', cat:'trust',
      note:'Saved model responses replayed in place of live calls, so tests and CI run deterministically with no key and no cost. Makes a pipeline built on a non-deterministic component testable, at the price of fixtures that drift from real behaviour if never refreshed.' },
    { id:'nondeterministictesting', label:'Testing Non-Deterministic Systems', cat:'trust',
      note:'Testing the deterministic parts exhaustively and cheaply — parsers, validators, rule tables, orchestration logic — while covering model-dependent parts with fixtures plus a handful of live end-to-end runs. Asserting on exact model wording is the mistake that leaves such suites permanently broken.' },
    { id:'costlatency', label:'Cost & Latency Trade-off', cat:'core',
      note:'Fan-out, extra review passes and larger contexts all buy quality with tokens and wall-clock time, usually at multiples rather than margins. Worth measuring per design rather than assuming, because the more expensive version does not automatically win.' ,
      deepDive: BYTE_TO_ANSWER+'#s-orchestration' }
  ];

  var byId = {};
  CONCEPTS.forEach(function(c){ byId[c.id] = c; });
  function relatedOf(id){
    var out = [];
    EDGES.forEach(function(e){
      if (e[0]===id) out.push(e[1]);
      else if (e[1]===id) out.push(e[0]);
    });
    return out;
  }

  var footerNote = document.getElementById('footerNote');
  var deepCount = CONCEPTS.filter(function(c){ return c.deepDive; }).length;
  footerNote.textContent = CONCEPTS.length + ' concepts mapped so far · ' + deepCount + ' with a full interactive deep dive · this atlas grows as new concepts are added.';

  /* ---------------- panel ---------------- */
  var panel = document.getElementById('detailPanel');
  var panelBody = document.getElementById('panelBody');
  var panelClose = document.getElementById('panelClose');
  var lastFocused = null;
  var state = { selectedId: null, query: '' };

  function openPanel(id){
    var c = byId[id];
    if (!c) return;
    state.selectedId = id;
    var catInfo = CATS[c.cat];
    var related = relatedOf(id);
    var html = '';
    html += '<span class="panel-cat" style="background:color-mix(in srgb, var('+catInfo.colorVar+') 20%, transparent); color:var('+catInfo.colorVar+');">'+catInfo.label+'</span>';
    html += '<h2>'+escapeHtml(c.label)+'</h2>';
    html += '<p class="note">'+escapeHtml(c.note)+'</p>';
    if (related.length){
      html += '<div class="related-label">Connects to</div><div class="related-chips">';
      related.forEach(function(rid){
        var rc = byId[rid];
        if (rc) html += '<button type="button" data-id="'+rid+'">'+escapeHtml(rc.label)+'</button>';
      });
      html += '</div>';
    }
    if (c.deepDive){
      html += '<a class="deepdive-link" href="'+c.deepDive+'" target="_blank" rel="noopener">Open full deep dive → Byte to Answer</a>';
    } else {
      html += '<div class="no-deepdive">No full interactive deep dive yet — flagged for a future build.</div>';
    }
    panelBody.innerHTML = html;
    Array.prototype.forEach.call(panelBody.querySelectorAll('.related-chips button'), function(btn){
      btn.addEventListener('click', function(){ openPanel(btn.getAttribute('data-id')); });
    });
    if (!panel.classList.contains('open')){
      lastFocused = document.activeElement;
      panel.classList.add('open');
      panel.setAttribute('aria-hidden','false');
      panel.focus();
    }
  }
  function closePanel(){
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden','true');
    state.selectedId = null;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  panelClose.addEventListener('click', closePanel);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });
  document.addEventListener('pointerdown', function(e){
    if (panel.classList.contains('open') && !panel.contains(e.target) && !e.target.closest('canvas')) closePanel();
  });

  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* ---------------- view toggle ---------------- */
  var graphWrap = document.getElementById('graphWrap');
  var listWrap = document.getElementById('listWrap');
  var viewGraphBtn = document.getElementById('viewGraphBtn');
  var viewListBtn = document.getElementById('viewListBtn');
  function setView(mode){
    var graph = mode==='graph';
    graphWrap.hidden = !graph;
    listWrap.hidden = graph;
    viewGraphBtn.classList.toggle('active', graph);
    viewListBtn.classList.toggle('active', !graph);
    viewGraphBtn.setAttribute('aria-pressed', String(graph));
    viewListBtn.setAttribute('aria-pressed', String(!graph));
    if (graph) sizeCanvas();
  }
  viewGraphBtn.addEventListener('click', function(){ setView('graph'); });
  viewListBtn.addEventListener('click', function(){ setView('list'); });

  function renderList(){
    // Groups and their order come from CATS, so adding a category is a data change.
    var order = Object.keys(CATS);
    var groups = {};
    order.forEach(function(cat){ groups[cat] = []; });
    CONCEPTS.forEach(function(c){
      if (state.query && c.label.toLowerCase().indexOf(state.query) === -1) return;
      if (groups[c.cat]) groups[c.cat].push(c);
    });
    var html = '';
    order.forEach(function(cat){
      if (!groups[cat].length) return;
      var info = CATS[cat];
      html += '<div class="list-group"><h2><span class="swatch" style="background:var('+info.colorVar+')"></span>'+info.label+'</h2><div class="cards">';
      groups[cat].forEach(function(c){
        html += '<button type="button" class="card" style="border-left-color:var('+info.colorVar+')" data-id="'+c.id+'">' +
                '<h3>'+escapeHtml(c.label)+'</h3><p>'+escapeHtml(c.note)+'</p>' +
                '<span class="tag">'+(c.deepDive ? 'Full deep dive' : 'Note only')+'</span></button>';
      });
      html += '</div></div>';
    });
    listWrap.innerHTML = html || '<p style="color:var(--ink-soft); font-family:var(--font-mono); font-size:0.85rem;">No concepts match your search.</p>';
    Array.prototype.forEach.call(listWrap.querySelectorAll('.card'), function(card){
      card.addEventListener('click', function(){ openPanel(card.getAttribute('data-id')); });
    });
  }

  /* ---------------- graph ---------------- */
  var canvas = document.getElementById('graphCanvas');
  var ctx = canvas.getContext('2d');
  var emptyMsg = document.getElementById('emptyMsg');
  var emptyQuery = document.getElementById('emptyQuery');
  var W=0, H=0, dpr=1;
  var nodes = [], edges = [];

  function clamp(x,lo,hi){ return Math.max(lo, Math.min(hi, x)); }

  function sizeCanvas(){
    var rect = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = rect.width; H = rect.height;
    canvas.width = Math.max(1, W*dpr); canvas.height = Math.max(1, H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function initGraph(){
    CONCEPTS.forEach(function(c, i){
      var angle = (i/CONCEPTS.length) * Math.PI*2;
      var node = { id:c.id, label:c.label, cat:c.cat,
        x: W/2 + Math.cos(angle)*Math.min(W,H)*0.36 + (Math.random()-0.5)*14,
        y: H/2 + Math.sin(angle)*Math.min(W,H)*0.36 + (Math.random()-0.5)*14,
        vx:0, vy:0 };
      nodes.push(node);
    });
    var nById = {}; nodes.forEach(function(n){ nById[n.id]=n; });
    EDGES.forEach(function(e){ if (nById[e[0]] && nById[e[1]]) edges.push({ a:nById[e[0]], b:nById[e[1]] }); });
  }
  function simStep(){
    var repulsion = 2400, springLen = 96, springK = 0.02, centerK = 0.002, damping = 0.83;
    for (var i=0;i<nodes.length;i++){
      for (var j=i+1;j<nodes.length;j++){
        var dx = nodes[j].x-nodes[i].x, dy = nodes[j].y-nodes[i].y;
        var d2 = dx*dx+dy*dy || 0.01;
        var d = Math.sqrt(d2);
        var f = repulsion/d2;
        var fx = f*dx/d, fy = f*dy/d;
        nodes[i].vx -= fx; nodes[i].vy -= fy;
        nodes[j].vx += fx; nodes[j].vy += fy;
      }
    }
    edges.forEach(function(e){
      var dx = e.b.x-e.a.x, dy = e.b.y-e.a.y;
      var d = Math.sqrt(dx*dx+dy*dy) || 0.01;
      var diff = (d-springLen)*springK;
      var fx = diff*dx/d, fy = diff*dy/d;
      e.a.vx += fx; e.a.vy += fy;
      e.b.vx -= fx; e.b.vy -= fy;
    });
    nodes.forEach(function(n){
      n.vx += (W/2-n.x)*centerK; n.vy += (H/2-n.y)*centerK;
      if (n.dragging) return;
      n.vx *= damping; n.vy *= damping;
      n.x += n.vx; n.y += n.vy;
      n.x = clamp(n.x, 46, W-46); n.y = clamp(n.y, 30, H-30);
    });
  }
  function drawGraph(){
    ctx.clearRect(0,0,W,H);
    var lineColor = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
    var inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    var inkSoft = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim();
    ctx.lineWidth = 1.1; ctx.strokeStyle = lineColor;
    edges.forEach(function(e){ ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y); ctx.lineTo(e.b.x,e.b.y); ctx.stroke(); });

    var matched = state.query ? nodes.filter(function(n){ return n.label.toLowerCase().indexOf(state.query)>-1; }) : null;
    ctx.font = '600 11.5px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    nodes.forEach(function(n){
      var dim = matched && matched.indexOf(n) === -1;
      var color = getComputedStyle(document.documentElement).getPropertyValue(CATS[n.cat].colorVar).trim();
      var isSelected = n.id === state.selectedId;
      ctx.globalAlpha = dim ? 0.25 : 1;
      if (isSelected){
        ctx.beginPath(); ctx.arc(n.x, n.y, 12, 0, Math.PI*2);
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(n.x, n.y, 7, 0, Math.PI*2);
      ctx.fillStyle = color; ctx.fill();
      if (byId[n.id].deepDive){
        ctx.beginPath(); ctx.arc(n.x, n.y, 9.5, 0, Math.PI*2);
        ctx.strokeStyle = inkColor; ctx.lineWidth = 1.4; ctx.stroke();
      }
      ctx.fillStyle = dim ? inkSoft : inkColor;
      ctx.fillText(n.label, n.x, n.y+19);
      ctx.globalAlpha = 1;
    });

    emptyMsg.hidden = !(matched && matched.length===0);
  }

  var rafId = null;
  function loop(){ simStep(); drawGraph(); rafId = requestAnimationFrame(loop); }

  var dragNode = null, pointerStart = null, moved = 0;
  function pointerPos(evt){
    var rect = canvas.getBoundingClientRect();
    return { x: evt.clientX-rect.left, y: evt.clientY-rect.top };
  }
  function nodeAt(pos){
    for (var i=0;i<nodes.length;i++){
      var n = nodes[i], dx = pos.x-n.x, dy = pos.y-n.y;
      if (dx*dx+dy*dy < 15*15) return n;
    }
    return null;
  }
  canvas.addEventListener('pointerdown', function(evt){
    var pos = pointerPos(evt);
    var n = nodeAt(pos);
    moved = 0; pointerStart = pos;
    if (n){ n.dragging = true; dragNode = n; canvas.setPointerCapture(evt.pointerId); }
  });
  canvas.addEventListener('pointermove', function(evt){
    if (!dragNode) return;
    var pos = pointerPos(evt);
    moved += Math.abs(pos.x-pointerStart.x) + Math.abs(pos.y-pointerStart.y);
    pointerStart = pos;
    dragNode.x = clamp(pos.x,46,W-46); dragNode.y = clamp(pos.y,30,H-30);
    dragNode.vx = 0; dragNode.vy = 0;
    if (reduceMotion) drawGraph();
  });
  function releaseDrag(evt){
    if (dragNode){
      if (moved < 6) openPanel(dragNode.id);
      dragNode.dragging = false; dragNode = null;
    }
  }
  canvas.addEventListener('pointerup', releaseDrag);
  canvas.addEventListener('pointercancel', releaseDrag);

  window.addEventListener('resize', function(){
    if (nodes.length){ sizeCanvas(); if (reduceMotion) drawGraph(); }
  });

  /* ---------------- search ---------------- */
  var search = document.getElementById('search');
  search.addEventListener('input', function(){
    state.query = this.value.trim().toLowerCase();
    emptyQuery.textContent = this.value.trim();
    renderList();
    if (reduceMotion) drawGraph();
  });

  /* ---------------- boot ---------------- */
  sizeCanvas();
  initGraph();
  renderList();
  if (reduceMotion){ for (var i=0;i<260;i++) simStep(); drawGraph(); }
  else { loop(); }
})();
</script>
