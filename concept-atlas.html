<title>Concept Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#EEF0F3;
    --bg-panel:#FFFFFF;
    --bg-sunken:#E2E6EA;
    --ink:#20242B;
    --ink-soft:#5A616B;
    --line:#D2D7DC;
    --amber:#B15A15;
    --amber-bg:#F3E1CE;
    --teal:#186F67;
    --teal-bg:#D6EAE7;
    --focus:#2A6FD6;
    --font-display:'Big Shoulders Display', system-ui, sans-serif;
    --font-body:'Source Sans 3', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171C; --bg-panel:#1C2027; --bg-sunken:#11141A;
      --ink:#E7E9ED; --ink-soft:#9AA1AC; --line:#2E343D;
      --amber:#E2924D; --amber-bg:#3B2A18; --teal:#57BCB2; --teal-bg:#173330;
      --focus:#6FA3F2;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171C; --bg-panel:#1C2027; --bg-sunken:#11141A;
    --ink:#E7E9ED; --ink-soft:#9AA1AC; --line:#2E343D;
    --amber:#E2924D; --amber-bg:#3B2A18; --teal:#57BCB2; --teal-bg:#173330;
    --focus:#6FA3F2;
  }

  *{ box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:800; margin:0; text-wrap:balance; }
  p{ margin:0 0 0.85em; }
  ::selection{ background:var(--amber-bg); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
  button{ font-family:var(--font-mono); cursor:pointer; }

  .eyebrow{ font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.13em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }

  /* ---- topbar ---- */
  .topbar{
    display:flex; flex-wrap:wrap; gap:1rem 1.5rem; align-items:center; justify-content:space-between;
    padding:1rem clamp(1rem,3vw,2rem); border-bottom:1px solid var(--line); background:var(--bg-panel);
  }
  .topbar h1{ font-size:clamp(1.5rem,3vw,1.9rem); line-height:1; }
  .topbar .brand{ display:flex; flex-direction:column; gap:0.15rem; }
  .controls{ display:flex; gap:0.7rem; align-items:center; flex-wrap:wrap; }
  #search{
    background:var(--bg-sunken); border:1px solid var(--line); border-radius:7px; color:var(--ink);
    font-family:var(--font-body); font-size:0.9rem; padding:0.5rem 0.8rem; min-width:200px;
  }
  #search:focus{ outline:2px solid var(--focus); outline-offset:1px; }
  .view-toggle{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .view-toggle button{
    background:var(--bg-panel); color:var(--ink-soft); border:none; padding:0.5rem 0.9rem; font-size:0.78rem;
    letter-spacing:0.03em; text-transform:uppercase; font-weight:600;
  }
  .view-toggle button.active{ background:var(--ink); color:var(--bg-panel); }

  /* ---- legend bar ---- */
  .legend-bar{
    display:flex; flex-wrap:wrap; gap:1.1rem 1.6rem; align-items:center;
    padding:0.7rem clamp(1rem,3vw,2rem); border-bottom:1px solid var(--line);
    font-family:var(--font-mono); font-size:0.78rem; color:var(--ink-soft); background:var(--bg);
  }
  .legend-item{ display:flex; align-items:center; gap:0.45rem; }
  .swatch{ width:11px; height:11px; border-radius:50%; flex:none; }
  .swatch.amber{ background:var(--amber); } .swatch.teal{ background:var(--teal); } .swatch.core{ background:var(--ink-soft); }
  .deep-dot{ width:11px; height:11px; border-radius:50%; border:2px solid var(--ink); flex:none; }

  /* ---- stage ---- */
  .stage{ position:relative; flex:1; min-height:0; }
  .graph-wrap, .list-wrap{ position:absolute; inset:0; overflow:auto; }
  #graphCanvas{ display:block; width:100%; height:100%; touch-action:none; }
  .empty-msg{ position:absolute; top:1rem; left:50%; transform:translateX(-50%); font-family:var(--font-mono); font-size:0.85rem; color:var(--ink-soft); background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:0.5rem 1rem; }

  .list-wrap{ padding:1.4rem clamp(1rem,3vw,2rem) 3rem; }
  .list-group{ margin-bottom:2rem; }
  .list-group h2{ font-size:1.2rem; margin-bottom:0.8rem; display:flex; align-items:center; gap:0.5rem; }
  .cards{ display:grid; gap:0.75rem; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); }
  .card{
    text-align:left; background:var(--bg-panel); border:1px solid var(--line); border-left-width:4px;
    border-radius:9px; padding:0.9rem 1rem; cursor:pointer; font-family:var(--font-body); color:var(--ink);
  }
  .card:hover{ border-color:var(--ink-soft); }
  .card h3{ font-size:1rem; margin-bottom:0.3rem; font-family:var(--font-body); font-weight:700; }
  .card p{ font-size:0.85rem; color:var(--ink-soft); margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .tag{ font-family:var(--font-mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-top:0.4rem; display:inline-block; }

  /* ---- detail panel ---- */
  .panel{
    position:fixed; top:0; right:0; height:100%; width:400px; max-width:90vw;
    background:var(--bg-panel); border-left:1px solid var(--line); box-shadow:-12px 0 32px rgba(0,0,0,0.12);
    transform:translateX(100%); transition:transform 0.25s ease; z-index:50; overflow-y:auto;
    padding:1.6rem 1.5rem 2.5rem;
  }
  .panel.open{ transform:translateX(0); }
  .panel-close{
    position:absolute; top:1rem; right:1rem; background:none; border:none; color:var(--ink-soft);
    font-size:1.1rem; line-height:1; padding:0.3rem; border-radius:6px;
  }
  .panel-close:hover{ color:var(--ink); background:var(--bg-sunken); }
  .panel-cat{ display:inline-block; font-family:var(--font-mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; padding:0.25rem 0.6rem; border-radius:99px; margin-bottom:0.8rem; }
  .panel h2{ font-size:1.7rem; margin-bottom:0.9rem; padding-right:1.5rem; }
  .panel .note{ font-size:0.98rem; color:var(--ink); max-width:none; }
  .panel .related-label{ font-family:var(--font-mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin:1.3rem 0 0.6rem; }
  .related-chips{ display:flex; flex-wrap:wrap; gap:0.4rem; }
  .related-chips button{
    background:var(--bg-sunken); border:1px solid var(--line); border-radius:99px; color:var(--ink);
    font-family:var(--font-body); font-size:0.82rem; padding:0.3rem 0.75rem;
  }
  .related-chips button:hover{ border-color:var(--ink-soft); }
  .deepdive-link{
    display:inline-flex; align-items:center; gap:0.4rem; margin-top:1.4rem; text-decoration:none;
    background:var(--ink); color:var(--bg-panel); font-family:var(--font-mono); font-size:0.82rem;
    padding:0.6rem 1rem; border-radius:8px; font-weight:600;
  }
  .deepdive-link:hover{ filter:brightness(1.15); }
  .no-deepdive{ margin-top:1.4rem; font-family:var(--font-mono); font-size:0.8rem; color:var(--ink-soft); border:1px dashed var(--line); border-radius:8px; padding:0.7rem 0.9rem; }

  @media (max-width:720px){
    .panel{ top:auto; bottom:0; left:0; right:0; width:100%; max-width:100%; height:auto; max-height:75vh;
      border-left:none; border-top:1px solid var(--line); border-radius:16px 16px 0 0; transform:translateY(100%); }
    .panel.open{ transform:translateY(0); }
  }

  footer{ padding:0.9rem clamp(1rem,3vw,2rem); border-top:1px solid var(--line); background:var(--bg-panel); color:var(--ink-soft); font-family:var(--font-mono); font-size:0.76rem; }
</style>

<div class="topbar">
  <div class="brand">
    <span class="eyebrow">A living map</span>
    <h1>Concept Atlas</h1>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="Find a concept…" aria-label="Search concepts">
    <div class="view-toggle" role="group" aria-label="View mode">
      <button id="viewGraphBtn" class="active" type="button" aria-pressed="true">Graph</button>
      <button id="viewListBtn" type="button" aria-pressed="false">List</button>
    </div>
  </div>
</div>

<div class="legend-bar">
  <span class="legend-item"><span class="swatch amber"></span>Generative AI</span>
  <span class="legend-item"><span class="swatch teal"></span>Retrieval / RAG</span>
  <span class="legend-item"><span class="swatch core"></span>Cross-cutting</span>
  <span class="legend-item"><span class="deep-dot"></span>Has a full interactive deep dive</span>
</div>

<div class="stage">
  <div class="graph-wrap" id="graphWrap">
    <canvas id="graphCanvas"></canvas>
    <div class="empty-msg" id="emptyMsg" hidden>No concepts match "<span id="emptyQuery"></span>".</div>
  </div>
  <div class="list-wrap" id="listWrap" hidden></div>
</div>

<aside class="panel" id="detailPanel" tabindex="-1" aria-hidden="true">
  <button class="panel-close" id="panelClose" type="button" aria-label="Close detail panel">✕</button>
  <div id="panelBody"></div>
</aside>

<footer id="footerNote"></footer>

<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var BYTE_TO_ANSWER = 'byte-to-answer.html';

  var CATS = {
    genai: { colorVar:'--amber', label:'Generative AI' },
    rag:   { colorVar:'--teal',  label:'Retrieval / RAG' },
    core:  { colorVar:'--ink-soft', label:'Cross-cutting' }
  };

  var CONCEPTS = [
    { id:'byte', label:'Byte', cat:'genai',
      note:'The most basic unit a computer stores text as — 8 bits. Before a model can see "words", your text is already just a stream of bytes; UTF-8 is the encoding almost everything on the web uses.',
      deepDive: BYTE_TO_ANSWER+'#s-bytes' },
    { id:'token', label:'Token', cat:'genai',
      note:'A chunk of text — anywhere from one character to a whole word — that a model treats as a single unit. Real vocabularies hold tens of thousands of tokens, each mapped to an integer ID.',
      deepDive: BYTE_TO_ANSWER+'#s-tokens' },
    { id:'bpe', label:'Byte-Pair Encoding', cat:'genai',
      note:'The algorithm most tokenizers use to decide what counts as a token: start from individual bytes, then repeatedly merge whichever adjacent pair shows up most often in a huge training corpus, until you hit a target vocabulary size.',
      deepDive: BYTE_TO_ANSWER+'#s-tokens' },
    { id:'embedding', label:'Embedding', cat:'genai',
      note:'A list of numbers that stands in for a token\'s meaning. Learned during training so that tokens used in similar contexts end up with similar vectors — the whole basis for a model doing math on language at all.',
      deepDive: BYTE_TO_ANSWER+'#s-embed' },
    { id:'posenc', label:'Positional Encoding', cat:'genai',
      note:'A vector added to each token\'s embedding, generated purely from its position in the sequence. Without it, self-attention can\'t tell "dog bites man" from "man bites dog" — it has no built-in sense of order.',
      deepDive: BYTE_TO_ANSWER+'#s-posenc' },
    { id:'attention', label:'Self-Attention', cat:'genai',
      note:'The mechanism that lets every token look at every other token and decide how much to borrow from each, weighted by relevance — computed from Query, Key and Value vectors.',
      deepDive: BYTE_TO_ANSWER+'#s-attention' },
    { id:'multihead', label:'Multi-Head Attention', cat:'genai',
      note:'Running several attention "heads" in parallel, each with its own Query/Key/Value projections, so different heads can specialize — one might track nearby words, another long-range references.',
      deepDive: BYTE_TO_ANSWER+'#s-attention' },
    { id:'residual', label:'Residual Connection', cat:'genai',
      note:'A shortcut that adds a layer\'s input back onto its output. It guarantees information — and, during training, gradient — always has an unobstructed path through, which is what makes very deep stacks of layers trainable at all.',
      deepDive: BYTE_TO_ANSWER+'#s-ffn' },
    { id:'layernorm', label:'Layer Normalization', cat:'genai',
      note:'Rescales a vector to a stable mean and variance before it moves to the next layer, keeping numbers from exploding or vanishing as they pass through dozens of stacked blocks.',
      deepDive: BYTE_TO_ANSWER+'#s-ffn' },
    { id:'feedforward', label:'Feed-Forward Network', cat:'genai',
      note:'A small two-layer network applied independently to every token: expand to a wider hidden size, apply a non-linearity, then contract back down. A large share of a model\'s factual and pattern-matching capacity is thought to live here.',
      deepDive: BYTE_TO_ANSWER+'#s-ffn' },
    { id:'transformer', label:'Transformer Block', cat:'genai',
      note:'The repeating unit of a modern language model: multi-head attention, then a feed-forward network, each wrapped in a residual connection and layer norm. Stack it dozens of times and you have GPT, Claude, or any of their peers.',
      deepDive: BYTE_TO_ANSWER+'#s-stack' },
    { id:'softmax', label:'Softmax', cat:'genai',
      note:'Turns a list of raw scores into probabilities that sum to 1, exaggerating the gap between the largest and smallest. Used everywhere a model turns "scores" into a distribution — attention weights, next-token probabilities.',
      deepDive: BYTE_TO_ANSWER+'#s-sampling' },
    { id:'sampling', label:'Sampling & Decoding', cat:'genai',
      note:'The step where a probability distribution over the whole vocabulary becomes one chosen token. Greedy decoding always takes the top probability; sampling introduces controlled randomness instead.',
      deepDive: BYTE_TO_ANSWER+'#s-sampling' },
    { id:'temperature', label:'Temperature', cat:'genai',
      note:'A single number that reshapes a probability distribution before sampling. Near zero makes the model deterministic and repetitive; above one makes it more random and occasionally incoherent.',
      deepDive: BYTE_TO_ANSWER+'#s-sampling' },
    { id:'chunking', label:'Chunking', cat:'rag',
      note:'Splitting a long document into smaller, overlapping pieces small enough to embed meaningfully and retrieve precisely — the first step in building anything RAG can search.',
      deepDive: BYTE_TO_ANSWER+'#s-chunking' },
    { id:'vectorindex', label:'Vector Index', cat:'rag',
      note:'A data structure — FAISS, HNSW, or a managed vector database — built to find the nearest vectors to a query vector quickly, even across millions of embeddings.',
      deepDive: BYTE_TO_ANSWER+'#s-index' },
    { id:'cosine', label:'Cosine Similarity', cat:'rag',
      note:'A measure of how similarly two vectors point, from -1 to 1, ignoring their length. The default yardstick for "how relevant is this chunk to this question" in a vector search.',
      deepDive: BYTE_TO_ANSWER+'#s-retrieval' },
    { id:'retrieval', label:'Retrieval', cat:'rag',
      note:'Finding the passages most relevant to a question by embedding the question and ranking every candidate chunk against it — usually by cosine similarity.',
      deepDive: BYTE_TO_ANSWER+'#s-retrieval' },
    { id:'contextwindow', label:'Context Window', cat:'rag',
      note:'The full text a model actually reads before generating: instructions, retrieved passages, conversation history, and the live question, all within a fixed token budget.',
      deepDive: BYTE_TO_ANSWER+'#s-prompt' },
    { id:'promptassembly', label:'Prompt Assembly', cat:'rag',
      note:'The step where retrieved passages, a system instruction, and the user\'s question get stitched into one block of text — the model itself never changes, only what it\'s handed to read.',
      deepDive: BYTE_TO_ANSWER+'#s-prompt' },
    { id:'hallucination', label:'Hallucination', cat:'core',
      note:'A fluent, confident answer that is factually wrong or unsupported — because the model is still just predicting plausible next tokens, not checking anything against a source. RAG doesn\'t eliminate this, but it gives the model something true to draw on instead of guessing.',
      deepDive: BYTE_TO_ANSWER+'#s-hallucination' }
  ];

  var EDGES = [
    ['byte','token'], ['token','bpe'], ['token','embedding'], ['embedding','posenc'], ['posenc','transformer'],
    ['embedding','attention'], ['attention','multihead'], ['multihead','transformer'], ['attention','softmax'],
    ['transformer','residual'], ['transformer','layernorm'], ['residual','layernorm'],
    ['transformer','feedforward'], ['feedforward','layernorm'],
    ['transformer','sampling'], ['softmax','sampling'], ['sampling','temperature'],
    ['chunking','vectorindex'], ['embedding','vectorindex'], ['vectorindex','cosine'], ['cosine','retrieval'],
    ['retrieval','contextwindow'], ['contextwindow','promptassembly'], ['promptassembly','sampling'],
    ['hallucination','sampling'], ['hallucination','retrieval']
  ];

  var byId = {};
  CONCEPTS.forEach(function(c){ byId[c.id] = c; });
  function relatedOf(id){
    var out = [];
    EDGES.forEach(function(e){
      if (e[0]===id) out.push(e[1]);
      else if (e[1]===id) out.push(e[0]);
    });
    return out;
  }

  var footerNote = document.getElementById('footerNote');
  var deepCount = CONCEPTS.filter(function(c){ return c.deepDive; }).length;
  footerNote.textContent = CONCEPTS.length + ' concepts mapped so far · ' + deepCount + ' with a full interactive deep dive · this atlas grows as new concepts are added.';

  /* ---------------- panel ---------------- */
  var panel = document.getElementById('detailPanel');
  var panelBody = document.getElementById('panelBody');
  var panelClose = document.getElementById('panelClose');
  var lastFocused = null;
  var state = { selectedId: null, query: '' };

  function openPanel(id){
    var c = byId[id];
    if (!c) return;
    state.selectedId = id;
    var catInfo = CATS[c.cat];
    var related = relatedOf(id);
    var html = '';
    html += '<span class="panel-cat" style="background:color-mix(in srgb, var('+catInfo.colorVar+') 20%, transparent); color:var('+catInfo.colorVar+');">'+catInfo.label+'</span>';
    html += '<h2>'+escapeHtml(c.label)+'</h2>';
    html += '<p class="note">'+escapeHtml(c.note)+'</p>';
    if (related.length){
      html += '<div class="related-label">Connects to</div><div class="related-chips">';
      related.forEach(function(rid){
        var rc = byId[rid];
        if (rc) html += '<button type="button" data-id="'+rid+'">'+escapeHtml(rc.label)+'</button>';
      });
      html += '</div>';
    }
    if (c.deepDive){
      html += '<a class="deepdive-link" href="'+c.deepDive+'" target="_blank" rel="noopener">Open full deep dive → Byte to Answer</a>';
    } else {
      html += '<div class="no-deepdive">No full interactive deep dive yet — flagged for a future build.</div>';
    }
    panelBody.innerHTML = html;
    Array.prototype.forEach.call(panelBody.querySelectorAll('.related-chips button'), function(btn){
      btn.addEventListener('click', function(){ openPanel(btn.getAttribute('data-id')); });
    });
    if (!panel.classList.contains('open')){
      lastFocused = document.activeElement;
      panel.classList.add('open');
      panel.setAttribute('aria-hidden','false');
      panel.focus();
    }
  }
  function closePanel(){
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden','true');
    state.selectedId = null;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  panelClose.addEventListener('click', closePanel);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });
  document.addEventListener('pointerdown', function(e){
    if (panel.classList.contains('open') && !panel.contains(e.target) && !e.target.closest('canvas')) closePanel();
  });

  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* ---------------- view toggle ---------------- */
  var graphWrap = document.getElementById('graphWrap');
  var listWrap = document.getElementById('listWrap');
  var viewGraphBtn = document.getElementById('viewGraphBtn');
  var viewListBtn = document.getElementById('viewListBtn');
  function setView(mode){
    var graph = mode==='graph';
    graphWrap.hidden = !graph;
    listWrap.hidden = graph;
    viewGraphBtn.classList.toggle('active', graph);
    viewListBtn.classList.toggle('active', !graph);
    viewGraphBtn.setAttribute('aria-pressed', String(graph));
    viewListBtn.setAttribute('aria-pressed', String(!graph));
    if (graph) sizeCanvas();
  }
  viewGraphBtn.addEventListener('click', function(){ setView('graph'); });
  viewListBtn.addEventListener('click', function(){ setView('list'); });

  function renderList(){
    var groups = { genai:[], rag:[], core:[] };
    CONCEPTS.forEach(function(c){
      if (state.query && c.label.toLowerCase().indexOf(state.query) === -1) return;
      groups[c.cat].push(c);
    });
    var order = ['genai','rag','core'];
    var html = '';
    order.forEach(function(cat){
      if (!groups[cat].length) return;
      var info = CATS[cat];
      html += '<div class="list-group"><h2><span class="swatch" style="background:var('+info.colorVar+')"></span>'+info.label+'</h2><div class="cards">';
      groups[cat].forEach(function(c){
        html += '<button type="button" class="card" style="border-left-color:var('+info.colorVar+')" data-id="'+c.id+'">' +
                '<h3>'+escapeHtml(c.label)+'</h3><p>'+escapeHtml(c.note)+'</p>' +
                '<span class="tag">'+(c.deepDive ? 'Full deep dive' : 'Note only')+'</span></button>';
      });
      html += '</div></div>';
    });
    listWrap.innerHTML = html || '<p style="color:var(--ink-soft); font-family:var(--font-mono); font-size:0.85rem;">No concepts match your search.</p>';
    Array.prototype.forEach.call(listWrap.querySelectorAll('.card'), function(card){
      card.addEventListener('click', function(){ openPanel(card.getAttribute('data-id')); });
    });
  }

  /* ---------------- graph ---------------- */
  var canvas = document.getElementById('graphCanvas');
  var ctx = canvas.getContext('2d');
  var emptyMsg = document.getElementById('emptyMsg');
  var emptyQuery = document.getElementById('emptyQuery');
  var W=0, H=0, dpr=1;
  var nodes = [], edges = [];

  function clamp(x,lo,hi){ return Math.max(lo, Math.min(hi, x)); }

  function sizeCanvas(){
    var rect = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = rect.width; H = rect.height;
    canvas.width = Math.max(1, W*dpr); canvas.height = Math.max(1, H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function initGraph(){
    CONCEPTS.forEach(function(c, i){
      var angle = (i/CONCEPTS.length) * Math.PI*2;
      var node = { id:c.id, label:c.label, cat:c.cat,
        x: W/2 + Math.cos(angle)*Math.min(W,H)*0.36 + (Math.random()-0.5)*14,
        y: H/2 + Math.sin(angle)*Math.min(W,H)*0.36 + (Math.random()-0.5)*14,
        vx:0, vy:0 };
      nodes.push(node);
    });
    var nById = {}; nodes.forEach(function(n){ nById[n.id]=n; });
    EDGES.forEach(function(e){ if (nById[e[0]] && nById[e[1]]) edges.push({ a:nById[e[0]], b:nById[e[1]] }); });
  }
  function simStep(){
    var repulsion = 2400, springLen = 96, springK = 0.02, centerK = 0.002, damping = 0.83;
    for (var i=0;i<nodes.length;i++){
      for (var j=i+1;j<nodes.length;j++){
        var dx = nodes[j].x-nodes[i].x, dy = nodes[j].y-nodes[i].y;
        var d2 = dx*dx+dy*dy || 0.01;
        var d = Math.sqrt(d2);
        var f = repulsion/d2;
        var fx = f*dx/d, fy = f*dy/d;
        nodes[i].vx -= fx; nodes[i].vy -= fy;
        nodes[j].vx += fx; nodes[j].vy += fy;
      }
    }
    edges.forEach(function(e){
      var dx = e.b.x-e.a.x, dy = e.b.y-e.a.y;
      var d = Math.sqrt(dx*dx+dy*dy) || 0.01;
      var diff = (d-springLen)*springK;
      var fx = diff*dx/d, fy = diff*dy/d;
      e.a.vx += fx; e.a.vy += fy;
      e.b.vx -= fx; e.b.vy -= fy;
    });
    nodes.forEach(function(n){
      n.vx += (W/2-n.x)*centerK; n.vy += (H/2-n.y)*centerK;
      if (n.dragging) return;
      n.vx *= damping; n.vy *= damping;
      n.x += n.vx; n.y += n.vy;
      n.x = clamp(n.x, 46, W-46); n.y = clamp(n.y, 30, H-30);
    });
  }
  function drawGraph(){
    ctx.clearRect(0,0,W,H);
    var lineColor = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
    var inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    var inkSoft = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim();
    ctx.lineWidth = 1.1; ctx.strokeStyle = lineColor;
    edges.forEach(function(e){ ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y); ctx.lineTo(e.b.x,e.b.y); ctx.stroke(); });

    var matched = state.query ? nodes.filter(function(n){ return n.label.toLowerCase().indexOf(state.query)>-1; }) : null;
    ctx.font = '600 11.5px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    nodes.forEach(function(n){
      var dim = matched && matched.indexOf(n) === -1;
      var color = getComputedStyle(document.documentElement).getPropertyValue(CATS[n.cat].colorVar).trim();
      var isSelected = n.id === state.selectedId;
      ctx.globalAlpha = dim ? 0.25 : 1;
      if (isSelected){
        ctx.beginPath(); ctx.arc(n.x, n.y, 12, 0, Math.PI*2);
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(n.x, n.y, 7, 0, Math.PI*2);
      ctx.fillStyle = color; ctx.fill();
      if (byId[n.id].deepDive){
        ctx.beginPath(); ctx.arc(n.x, n.y, 9.5, 0, Math.PI*2);
        ctx.strokeStyle = inkColor; ctx.lineWidth = 1.4; ctx.stroke();
      }
      ctx.fillStyle = dim ? inkSoft : inkColor;
      ctx.fillText(n.label, n.x, n.y+19);
      ctx.globalAlpha = 1;
    });

    emptyMsg.hidden = !(matched && matched.length===0);
  }

  var rafId = null;
  function loop(){ simStep(); drawGraph(); rafId = requestAnimationFrame(loop); }

  var dragNode = null, pointerStart = null, moved = 0;
  function pointerPos(evt){
    var rect = canvas.getBoundingClientRect();
    return { x: evt.clientX-rect.left, y: evt.clientY-rect.top };
  }
  function nodeAt(pos){
    for (var i=0;i<nodes.length;i++){
      var n = nodes[i], dx = pos.x-n.x, dy = pos.y-n.y;
      if (dx*dx+dy*dy < 15*15) return n;
    }
    return null;
  }
  canvas.addEventListener('pointerdown', function(evt){
    var pos = pointerPos(evt);
    var n = nodeAt(pos);
    moved = 0; pointerStart = pos;
    if (n){ n.dragging = true; dragNode = n; canvas.setPointerCapture(evt.pointerId); }
  });
  canvas.addEventListener('pointermove', function(evt){
    if (!dragNode) return;
    var pos = pointerPos(evt);
    moved += Math.abs(pos.x-pointerStart.x) + Math.abs(pos.y-pointerStart.y);
    pointerStart = pos;
    dragNode.x = clamp(pos.x,46,W-46); dragNode.y = clamp(pos.y,30,H-30);
    dragNode.vx = 0; dragNode.vy = 0;
    if (reduceMotion) drawGraph();
  });
  function releaseDrag(evt){
    if (dragNode){
      if (moved < 6) openPanel(dragNode.id);
      dragNode.dragging = false; dragNode = null;
    }
  }
  canvas.addEventListener('pointerup', releaseDrag);
  canvas.addEventListener('pointercancel', releaseDrag);

  window.addEventListener('resize', function(){
    if (nodes.length){ sizeCanvas(); if (reduceMotion) drawGraph(); }
  });

  /* ---------------- search ---------------- */
  var search = document.getElementById('search');
  search.addEventListener('input', function(){
    state.query = this.value.trim().toLowerCase();
    emptyQuery.textContent = this.value.trim();
    renderList();
    if (reduceMotion) drawGraph();
  });

  /* ---------------- boot ---------------- */
  sizeCanvas();
  initGraph();
  renderList();
  if (reduceMotion){ for (var i=0;i<260;i++) simStep(); drawGraph(); }
  else { loop(); }
})();
</script>
